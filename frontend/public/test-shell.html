<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shell WebSocket Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .connected {
            background: #1e3a1e;
            border: 1px solid #4caf50;
        }
        .disconnected {
            background: #3a1e1e;
            border: 1px solid #f44336;
        }
        .connecting {
            background: #3a3a1e;
            border: 1px solid #ff9800;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #1177bb;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        #output {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            min-height: 300px;
            max-height: 500px;
            overflow-y: auto;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #666;
        }
        .log-info { border-color: #2196f3; }
        .log-success { border-color: #4caf50; }
        .log-error { border-color: #f44336; }
        .log-warn { border-color: #ff9800; }
        input {
            padding: 10px;
            margin: 5px;
            background: #3d3d3d;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Shell WebSocket Test</h1>

    <div id="status" class="status disconnected">Disconnected</div>

    <div>
        <input type="text" id="projectPath" placeholder="Project path" value="E:\zhihui-soft\agent_project">
        <button id="connectBtn" onclick="connect()">Connect</button>
        <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
        <button onclick="clearOutput()">Clear</button>
    </div>

    <div>
        <input type="text" id="command" placeholder="Command to send" value="dir">
        <button onclick="sendCommand()">Send Command</button>
    </div>

    <div id="output"></div>

    <script>
        let ws = null;
        let isConnected = false;

        function log(message, type = 'info') {
            const output = document.getElementById('output');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.innerHTML = `<span style="color: #888;">[${timestamp}]</span> ${message}`;
            output.appendChild(entry);
            output.scrollTop = output.scrollHeight;
        }

        function updateStatus(status) {
            const statusEl = document.getElementById('status');
            statusEl.className = `status ${status}`;
            statusEl.textContent = status.charAt(0).toUpperCase() + status.slice(1);

            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');

            if (status === 'connected') {
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                isConnected = true;
            } else if (status === 'connecting') {
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                isConnected = false;
            } else {
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
                isConnected = false;
            }
        }

        function connect() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                log('Already connected or connecting', 'warn');
                return;
            }

            const projectPath = document.getElementById('projectPath').value;
            if (!projectPath) {
                log('Please enter a project path', 'error');
                return;
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/shell`;

            log(`Connecting to: ${wsUrl}`, 'info');
            log(`Project path: ${projectPath}`, 'info');
            updateStatus('connecting');

            ws = new WebSocket(wsUrl);

            // Connection timeout
            const timeout = setTimeout(() => {
                if (ws && ws.readyState === WebSocket.CONNECTING) {
                    log('Connection timeout (10s)', 'error');
                    ws.close();
                    updateStatus('disconnected');
                }
            }, 10000);

            ws.onopen = () => {
                clearTimeout(timeout);
                log('WebSocket connected!', 'success');
                updateStatus('connected');

                // Send init message
                const initMessage = {
                    type: 'init',
                    projectPath: projectPath,
                    cols: 80,
                    rows: 24
                };

                try {
                    ws.send(JSON.stringify(initMessage));
                    log('Init message sent', 'success');
                } catch (error) {
                    log(`Failed to send init message: ${error.message}`, 'error');
                }
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);

                    if (data.type === 'heartbeat') {
                        log('Heartbeat received', 'info');
                    } else if (data.type === 'output') {
                        log(`Output: ${data.data.substring(0, 100)}...`, 'success');
                    } else {
                        log(`Unknown message type: ${data.type}`, 'warn');
                    }
                } catch (error) {
                    log(`Failed to parse message: ${error.message}`, 'error');
                }
            };

            ws.onclose = (event) => {
                clearTimeout(timeout);
                log(`WebSocket closed: code=${event.code}, reason=${event.reason || 'None'}`, 'warn');
                updateStatus('disconnected');
            };

            ws.onerror = (error) => {
                clearTimeout(timeout);
                log('WebSocket error occurred', 'error');
                updateStatus('disconnected');
            };
        }

        function disconnect() {
            if (ws) {
                log('Closing connection...', 'info');
                ws.close();
                ws = null;
                updateStatus('disconnected');
            }
        }

        function sendCommand() {
            if (!isConnected || !ws) {
                log('Not connected', 'error');
                return;
            }

            const command = document.getElementById('command').value;
            if (!command) {
                log('Please enter a command', 'error');
                return;
            }

            try {
                const message = {
                    type: 'input',
                    data: command + '\r'
                };
                ws.send(JSON.stringify(message));
                log(`Command sent: ${command}`, 'info');
            } catch (error) {
                log(`Failed to send command: ${error.message}`, 'error');
            }
        }

        function clearOutput() {
            document.getElementById('output').innerHTML = '';
        }

        // Log page info
        log(`Page loaded. WebSocket URL: ws://${window.location.host}/shell`, 'info');
        log(`Backend proxy: http://localhost:8080`, 'info');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>离线 - AI 工作台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 400px;
    }
    
    .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    
    p {
      opacity: 0.9;
      margin-bottom: 1.5rem;
    }
    
    button {
      background: white;
      color: #667eea;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    button:hover {
      transform: scale(1.05);
    }
    
    button:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>网络连接已断开</h1>
    <p>请检查您的网络连接，然后重试</p>
    <button onclick="window.location.reload()">
      重新加载
    </button>
  </div>
  
  <script>
    // 监听网络状态变化
    window.addEventListener('online', () => {
      window.location.reload();
    });
    
    // 定期检查网络
    setInterval(async () => {
      try {
        const response = await fetch('/api/health', { method: 'HEAD' });
        if (response.ok) {
          window.location.reload();
        }
      } catch (e) {
        // 仍然离线
      }
    }, 5000);
  </script>
</body>
</html>

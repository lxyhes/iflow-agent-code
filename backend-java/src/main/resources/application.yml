server:
  port: 8080
  tomcat:
    basedir: ./tomcat-work

# WebUI 配置
webui:
  enabled: true
  host: 0.0.0.0
  port: 5173
  remote-access: true
  ip-whitelist: []
  session-timeout: 3600000
  max-concurrent-sessions: 10
  https-enabled: false
  pwa-enabled: true
  app-name: AI 工作台
  app-description: 智能开发助手平台

spring:
  autoconfigure:
    exclude:
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioSpeechAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioTranscriptionAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeImageAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeRerankAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeVideoAutoConfiguration
  application:
    name: iflow-agent-backend

  datasource:
    url: jdbc:sqlite:./database/agent.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
    repositories:
      enabled: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  mvc:
    trailing-slash-match: false
    # 禁用默认静态资源处理，确保所有 /api 请求都由 DispatcherServlet 处理
    static-path-pattern: /static/**

  # DevTools Configuration - 启用热加载
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  # Spring AI Alibaba Configuration - 可选配置
  # 如需使用 DashScope，请设置 ALIYUN_DASHSCOPE_API_KEY 环境变量
  ai:
    dashscope:
      api-key: ${ALIYUN_DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen-turbo
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v2

# CORS Configuration
cors:
  origins: "http://localhost:5173,http://localhost:3001,http://127.0.0.1:5173,http://127.0.1.1:5173"
  dev-mode: true

# Cache Configuration
cache:
  base-dir: "./cache"

# LLM Configuration - iFlow 作为主要的 AI 服务
llm:
  # 默认使用 iFlow
  provider: iflow
  api-key: ${IFLOW_API_KEY:}
  base-url: ${IFLOW_API_BASE_URL:https://api.iflow.cn/v1}
  default-model: glm-4
  default-temperature: 0.7

# iFlow SDK Configuration
# iFlow SDK 自动管理 iFlow CLI 进程，提供大模型能力
iflow:
  enabled: true
  sdk:
    # WebSocket URL，默认本地 8090 端口
    url: ws://localhost:8090/acp
    # 是否自动启动 iFlow 进程
    auto-start: true
    # 超时时间（秒）- 增加到 120 秒以支持复杂 AI 请求
    timeout-seconds: 120
    # 权限模式: AUTO（SDK 1.0.4-fix 仅支持 AUTO 模式）
    permission-mode: AUTO
  # OAuth2 登录配置
  oauth:
    # iFlow 平台分配的客户端 ID
    client-id: ${IFLOW_OAUTH_CLIENT_ID:10009311001}
    # iFlow 平台分配的客户端密钥（如果有）
    client-secret: ${IFLOW_OAUTH_CLIENT_SECRET:}
    # 授权端点
    authorization-uri: https://iflow.cn/oauth
    # Token 交换端点
    token-uri: https://iflow.cn/api/oauth/token
    # 回调地址，必须与 iFlow 平台配置一致
    redirect-uri: ${IFLOW_OAUTH_REDIRECT_URI:http://localhost:8080/api/iflow/oauth/callback}

# AgentScope Configuration - 面试功能（可选）
# 如需使用 AgentScope 面试功能，请配置 API key
agentscope:
  enabled: true
  dashscope:
    api-key: ${AGENTSCOPE_DASHSCOPE_API_KEY:}
    model: qwen-turbo

# Aliyun Cloud Configuration - OCR 服务（可选）
aliyun:
  access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
  access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
  region: cn-hangzhou
  ocr:
    endpoint: ocr.cn-hangzhou.aliyuncs.com

# Logging
logging:
  level:
    root: INFO
    com.iflow.agent: DEBUG
    org.springframework.web: INFO
    org.springframework.boot: INFO
    org.springframework.context: INFO
    org.springframework.beans: INFO
  pattern:
    console: "%d{HH:mm:ss} [%level] %logger{36}: %msg%n"

# File Upload
file:
  max-size: 104857600  # 100MB in bytes

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    info:
      enabled: true